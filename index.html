<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小红书自动排版工具</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel form-panel">
      <h1>小红书自动排版工具</h1>
      <p class="subtitle">输入草稿，一键生成更适合小红书阅读的内容。</p>

      <label>标题</label>
      <input id="titleInput" placeholder="例如：通勤穿搭分享｜一周不重样" maxlength="40" />

      <label>正文草稿</label>
      <textarea id="contentInput" rows="11" placeholder="粘贴你的原始内容，支持长段落。"></textarea>

      <div class="grid-two">
        <div>
          <label>每段字数上限</label>
          <input id="chunkSize" type="number" min="20" max="120" value="48" />
        </div>
        <div>
          <label>语气风格</label>
          <select id="toneSelect">
            <option value="friendly">亲切分享</option>
            <option value="pro">干货专业</option>
            <option value="story">故事感</option>
          </select>
        </div>
      </div>

      <div class="grid-two">
        <div>
          <label>Emoji 强度</label>
          <input id="emojiLevel" type="range" min="0" max="3" value="1" />
        </div>
        <div>
          <label>关键词（逗号分隔）</label>
          <input id="keywordsInput" placeholder="通勤,穿搭,显高" />
        </div>
      </div>

      <div class="actions">
        <button id="formatBtn">✨ 自动排版</button>
        <button id="copyBtn" class="ghost">复制结果</button>
        <span id="copyState" aria-live="polite"></span>
      </div>
    </section>

    <section class="panel preview-panel">
      <h2>预览</h2>
      <article id="preview"></article>
      <label class="result-title">最终文案</label>
      <textarea id="resultText" rows="10" readonly></textarea>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
