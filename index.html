<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>钢铁行业安全动漫宣传视频生成器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel form-panel">
      <h1>钢铁行业安全动漫宣传视频生成器</h1>
      <p class="subtitle">输入安全案例，一键生成可用于制作动画短视频的分镜脚本、旁白与镜头说明。</p>

      <label for="caseType">安全案例类型</label>
      <input id="caseType" placeholder="例如：高空坠落、机械卷入、煤气中毒" />

      <label for="locationInput">发生场景</label>
      <input id="locationInput" placeholder="例如：连铸平台、检修走台、轧线设备区" />

      <label for="audienceSelect">目标人群</label>
      <select id="audienceSelect">
        <option value="frontline">一线作业人员</option>
        <option value="manager">班组长/管理人员</option>
        <option value="mixed">全员培训</option>
      </select>

      <div class="grid-two">
        <div>
          <label for="durationInput">视频时长（秒）</label>
          <input id="durationInput" type="number" min="30" max="180" value="60" />
        </div>
        <div>
          <label for="styleSelect">动画风格</label>
          <select id="styleSelect">
            <option value="serious">严谨警示风</option>
            <option value="story">故事还原风</option>
            <option value="warm">温和科普风</option>
          </select>
        </div>
      </div>

      <label for="extraInput">补充要求（可选）</label>
      <textarea id="extraInput" rows="3" placeholder="例如：强调双人监护制度，结尾加入班前会口号"></textarea>

      <div class="actions">
        <button id="generateBtn">🎬 生成视频脚本</button>
        <button id="copyBtn" class="ghost">复制脚本</button>
        <span id="copyState" aria-live="polite"></span>
      </div>
    </section>

    <section class="panel preview-panel">
      <h2>生成结果</h2>
      <article id="preview"></article>
      <label class="result-title" for="resultText">可导出文案</label>
      <textarea id="resultText" rows="14" readonly></textarea>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
